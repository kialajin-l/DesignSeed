<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px;
    background: #0A0A0F;
    font-family: 'Inter', sans-serif;
    color: #E0E0E0;
    overflow: hidden;
    position: relative;
  }
  /* Grid background */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }
  /* Glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(124,58,237,0.15); top: -100px; right: 100px; }
  .orb-2 { width: 300px; height: 300px; background: rgba(0,255,255,0.1); bottom: -50px; left: 50px; }
  .orb-3 { width: 250px; height: 250px; background: rgba(255,0,255,0.08); top: 200px; left: 400px; }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 80px;
  }

  .title {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #00FFFF 0%, #7C3AED 40%, #FF00FF 70%, #00FFFF 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    text-align: center;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
    text-align: center;
  }

  .tagline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: rgba(0,255,255,0.6);
    letter-spacing: 0.2em;
    margin-bottom: 32px;
    text-align: center;
  }

  .styles-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 36px;
    max-width: 1100px;
  }

  .style-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    white-space: nowrap;
    border: 1px solid;
  }

  .style-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stats {
    display: flex;
    gap: 48px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: #00FFFF;
    line-height: 1.2;
  }

  .stat-label {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stat-divider {
    width: 1px;
    height: 40px;
    background: rgba(255,255,255,0.1);
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="container">
    <div class="title">DesignSeed</div>
    <div class="subtitle">会生长的 AI 设计系统 &middot; Agent-first Design System</div>
    <div class="tagline">SEED &rarr; GROW &rarr; EVOLVE</div>
    <div class="styles-row">
      <span class="style-pill" style="background:rgba(0,0,0,0.3);border-color:#555;color:#fff"><span class="style-dot" style="background:#000"></span>Minimalism</span>
      <span class="style-pill" style="background:rgba(108,99,255,0.15);border-color:rgba(108,99,255,0.4);color:#8B85E9"><span class="style-dot" style="background:#6C63FF"></span>Neumorphism</span>
      <span class="style-pill" style="background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.4);color:#A78BFA"><span class="style-dot" style="background:#7C3AED"></span>Glassmorphism</span>
      <span class="style-pill" style="background:rgba(255,51,102,0.15);border-color:rgba(255,51,102,0.4);color:#FF3366"><span class="style-dot" style="background:#FF3366"></span>Memphis</span>
      <span class="style-pill" style="background:rgba(0,255,255,0.1);border-color:rgba(0,255,255,0.3);color:#00FFFF"><span class="style-dot" style="background:#00FFFF"></span>Cyberpunk</span>
      <span class="style-pill" style="background:rgba(44,44,44,0.3);border-color:rgba(200,192,180,0.4);color:#C8C0B4"><span class="style-dot" style="background:#2C2C2C"></span>Ink Wash</span>
      <span class="style-pill" style="background:rgba(0,170,0,0.1);border-color:rgba(0,170,0,0.3);color:#00AA00"><span class="style-dot" style="background:#00AA00"></span>Retro Pixel</span>
      <span class="style-pill" style="background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:#00D4FF"><span class="style-dot" style="background:#00D4FF"></span>Futurism</span>
      <span class="style-pill" style="background:rgba(45,106,79,0.1);border-color:rgba(45,106,79,0.3);color:#52B788"><span class="style-dot" style="background:#2D6A4F"></span>Organic</span>
      <span class="style-pill" style="background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:#F59E0B"><span class="style-dot" style="background:#F59E0B"></span>Industrial</span>
      <span class="style-pill" style="background:rgba(231,111,81,0.1);border-color:rgba(231,111,81,0.3);color:#E76F51"><span class="style-dot" style="background:#E76F51"></span>Hand Drawn</span>
      <span class="style-pill" style="background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3);color:#3B82F6"><span class="style-dot" style="background:#3B82F6"></span>Data Viz</span>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="stat-value">12</div>
        <div class="stat-label">Built-in Styles</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value">17</div>
        <div class="stat-label">Seed Design Systems</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value">&lt;6ms</div>
        <div class="stat-label">Generation Speed</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-value">&infin;</div>
        <div class="stat-label">Evolution Possible</div>
      </div>
    </div>
  </div>
</body>
</html>
